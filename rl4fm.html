<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="「基盤モデルのための強化学習」サポートページ" />
		<title>Simple Page | Akifumi Wachi</title>
		<style>
			:root {
				color-scheme: light;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #202124;
				background: #ffffff;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				background: #ffffff;
			}

			main {
				width: min(100% - 3rem, 720px);
				margin: 0 auto;
				padding: 6rem 0;
			}

			h1 {
				margin: 0 0 1rem;
				font-size: clamp(2rem, 6vw, 3.25rem);
				line-height: 1.15;
				letter-spacing: -0.03em;
			}

			p {
				margin: 0 0 2rem;
				color: #5f6368;
				font-size: 1.05rem;
				line-height: 1.8;
			}

			a {
				color: #202124;
				text-underline-offset: 0.2em;
			}

			a:hover {
				text-decoration-thickness: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>基盤モデルのための強化学習</h1>
			<a href="index.html">トップページへ戻る</a>
		</main>
	</body>
</html>
